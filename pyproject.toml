[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instella-reasoning"
version = "0.1.0"
description = "Research scaffold for diagnosing reasoning, contamination, and attribution in AMD Instella models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Govind Arun Kumar" }
]
dependencies = [
  "pyyaml>=6.0.1",
  "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0"
]
hf = [
  "accelerate>=0.30.0",
  "datasets>=2.19.0",
  "safetensors>=0.4.3",
  # Upper bound is load-bearing: AMD Instella ships custom remote modeling code
  # (modeling_instella.py, trust_remote_code=True) written for the 4.4x attention-mask /
  # cache_position API. transformers 5.x removed that API, which silently breaks the
  # forward pass and yields *degenerate* generations. Pin below 5 until the model card
  # (or a pinned --revision) certifies 5.x compatibility.
  "transformers>=4.44,<5",
  # Symbolic answer equivalence for MATH scoring (\\frac, \\sqrt, pi, ...); optional at
  # runtime — instella_reasoning.answer_equivalence degrades to string/numeric match if
  # sympy is absent, but MATH accuracy is badly under-counted without it.
  "sympy>=1.12"
]
retrieval = [
  "faiss-cpu>=1.8.0",
  "sentence-transformers>=3.0.0",
  "scikit-learn>=1.5.0",
  "numpy>=1.24.0"
]
viz = [
  "matplotlib>=3.7.0"
]
stats = [
  "scipy>=1.11.0"
]
train = [
  "torch>=2.3.0",
  "peft>=0.11.0",
  "trl>=0.9.0",
  "wandb>=0.17.0"
]
all = [
  "instella-reasoning[dev,hf,retrieval,viz,stats,train]"
]

[project.scripts]
instella-reasoning = "instella_reasoning.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/instella_reasoning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
